buildscript {
    ext.kotlin_version = "2.0.21"
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

ext {
    compileSdkVersion = 36
    // BlackBox relies on a userspace virtualization/hidden-API compatibility
    // layer. Keep the host app target conservative while compiling against API 36.
    targetSdkVersion = 28
    versionName = '3.0.0-android16'
    versionCode = 300
    xVersion = '1.1.0'
    blackReflection = '1.1.2'
    ndkVersion = '28.0.13004108'
}
